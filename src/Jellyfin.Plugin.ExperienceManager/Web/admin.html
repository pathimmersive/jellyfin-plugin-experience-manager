<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Experience Manager</title>
</head>
<body>
    <div id="experienceManagerPage" data-role="page" class="page type-interior pluginConfigurationPage">
        <style>
            #experienceManagerPage .em-nav { display: flex; flex-wrap: wrap; gap: 1.5em; margin: 1em 0 2em; }
            #experienceManagerPage .em-nav-group { min-width: 9em; }
            #experienceManagerPage .em-nav-group h3 { margin: 0 0 .4em; font-size: .85em; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
            #experienceManagerPage .em-nav-page { display: block; background: none; border: 0; padding: .25em 0; color: inherit; font: inherit; cursor: pointer; opacity: .75; text-align: left; }
            #experienceManagerPage .em-nav-page[aria-current="page"] { opacity: 1; font-weight: 600; }
            #experienceManagerPage .em-nav-page .em-later { font-size: .8em; opacity: .7; }
            #experienceManagerPage table { border-collapse: collapse; width: 100%; margin: .5em 0 2em; }
            #experienceManagerPage th, #experienceManagerPage td { text-align: left; vertical-align: top; padding: .45em .8em .45em 0; border-bottom: 1px solid rgba(128, 128, 128, .25); }
            #experienceManagerPage th { font-weight: 600; }
            #experienceManagerPage td.em-num { text-align: right; padding-right: 1.5em; }
            #experienceManagerPage .em-apps { font-size: .85em; opacity: .7; }
            #experienceManagerPage .em-muted { opacity: .7; }
            #experienceManagerPage .em-prog { max-width: 100%; }
            #experienceManagerPage .em-prog-toolbar { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; margin: 1em 0; }
            #experienceManagerPage .em-prog-button { margin: 0; }
            #experienceManagerPage .em-prog-view[aria-pressed="true"] { font-weight: 600; outline: 2px solid currentColor; }
            #experienceManagerPage .em-prog-label { min-width: 8em; text-align: center; font-weight: 600; }
            #experienceManagerPage .em-prog-message, #experienceManagerPage .em-prog-error { color: #ff8a65; }
            #experienceManagerPage .em-prog-templates { margin: 0 0 1.5em; display: flex; flex-wrap: wrap; gap: .5em; align-items: center; }
            #experienceManagerPage .em-prog-templates h3 { width: 100%; margin: 0; font-size: 1em; }
            #experienceManagerPage .em-prog-year { position: relative; margin: 0 0 2em; }
            #experienceManagerPage .em-prog-lane { display: flex; align-items: stretch; min-height: 2.2em; border-bottom: 1px solid rgba(128, 128, 128, .25); }
            #experienceManagerPage .em-prog-lane-title { flex: 0 0 10em; padding: .45em .5em .45em 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            #experienceManagerPage .em-prog-track { position: relative; flex: 1 1 auto; min-width: 0; }
            #experienceManagerPage .em-prog-months { min-height: 1.6em; font-size: .85em; opacity: .7; }
            #experienceManagerPage .em-prog-month { position: absolute; top: .2em; border-left: 1px solid rgba(128, 128, 128, .35); padding-left: .25em; }
            #experienceManagerPage .em-prog-bar { position: absolute; top: .35em; height: 1.5em; line-height: 1.5em; padding: 0 .35em; box-sizing: border-box; border-radius: .25em; font-size: .8em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
            #experienceManagerPage .em-published { background: rgba(0, 164, 220, .55); }
            #experienceManagerPage .em-draft { border: 1px dashed currentColor; background: rgba(128, 128, 128, .15); }
            #experienceManagerPage .em-prog-bar.em-weekly { background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, .25) 0 2px, transparent 2px 10px); }
            #experienceManagerPage .em-prog-empty { position: absolute; top: .5em; font-size: .8em; }
            #experienceManagerPage .em-prog-today-marker { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff8a65; pointer-events: none; }
            #experienceManagerPage table.em-prog-monthgrid { table-layout: fixed; }
            #experienceManagerPage .em-prog-monthgrid td { height: 5em; overflow: hidden; }
            #experienceManagerPage .em-prog-monthgrid.em-compact td { height: 2.6em; padding: .2em; }
            #experienceManagerPage .em-prog-is-today .em-prog-daynum { color: #ff8a65; font-weight: 600; }
            #experienceManagerPage .em-prog-chip { display: block; font-size: .75em; padding: 0 .3em; margin: .1em 0; border-radius: .2em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
            #experienceManagerPage .em-compact .em-prog-chip { display: inline-block; width: .55em; height: .55em; padding: 0; margin: 0 .1em; border-radius: 50%; }
            #experienceManagerPage .em-prog-list { list-style: none; padding: 0; margin: .5em 0 1em; }
            #experienceManagerPage .em-prog-row { display: flex; flex-wrap: wrap; align-items: center; gap: .6em; padding: .5em; margin: 0 0 .4em; border-radius: .3em; }
            #experienceManagerPage .em-prog-handle { cursor: grab; opacity: .6; }
            #experienceManagerPage .em-prog-row-text { flex: 1 1 12em; min-width: 0; }
            #experienceManagerPage .em-prog-row-name { font-weight: 600; }
            #experienceManagerPage .em-prog-row-when { font-size: .85em; }
            #experienceManagerPage .em-prog-switch { display: inline-flex; gap: .3em; align-items: center; }
            #experienceManagerPage .em-prog-conflict { font-style: italic; }
            #experienceManagerPage .em-prog-editor { margin: 2em 0; padding: 1em; border: 1px solid rgba(128, 128, 128, .35); border-radius: .4em; max-width: 46em; box-sizing: border-box; }
            #experienceManagerPage .em-prog-editor fieldset { border: 1px solid rgba(128, 128, 128, .25); margin: 1em 0; padding: .6em; min-width: 0; }
            #experienceManagerPage .em-prog-field { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; margin: .4em 0; }
            #experienceManagerPage .em-prog-field > span { flex: 0 0 8em; }
            #experienceManagerPage .em-prog-field input, #experienceManagerPage .em-prog-field select { max-width: 100%; min-width: 0; box-sizing: border-box; }
            #experienceManagerPage .em-prog-field select[multiple] { min-height: 6em; min-width: 12em; }
            #experienceManagerPage .em-prog-monthday { display: inline-flex; gap: .4em; align-items: center; margin: .4em 1em .4em 0; }
            #experienceManagerPage .em-prog-monthday input { width: 4em; }
            #experienceManagerPage .em-prog-days { display: flex; flex-wrap: wrap; gap: .6em; }
            #experienceManagerPage .em-prog-change { border-top: 1px solid rgba(128, 128, 128, .25); padding: .5em 0; }
            #experienceManagerPage .em-prog-actions { display: flex; flex-wrap: wrap; gap: .5em; }
            #experienceManagerPage .em-prog-mark, #experienceManagerPage .em-prog-hidden { opacity: .8; font-style: italic; }
            @media (max-width: 600px) {
                #experienceManagerPage .em-nav { gap: .8em; }
                #experienceManagerPage .em-prog-field > span { flex-basis: 100%; }
                #experienceManagerPage .em-prog-editor { padding: .6em; }
            }
        </style>
        <div data-role="content">
            <div class="content-primary">
                <h2 class="sectionTitle">Experience Manager</h2>
                <nav class="em-nav" aria-label="Experience Manager"></nav>
                <div class="em-panel"></div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#experienceManagerPage');
                // The admin pages, grouped as the plugin's design has them. Only the built ones open.
                var groups = [
                    { title: 'Experience', pages: [{ id: 'layout', title: 'Home layout' }, { id: 'programming', title: 'Programming', built: true }] },
                    { title: 'People', pages: [{ id: 'audiences', title: 'Audiences' }, { id: 'defaults', title: 'Group defaults' }] },
                    { title: 'Rules', pages: [{ id: 'rules', title: 'Content rules' }, { id: 'integrations', title: 'Integrations' }] },
                    { title: 'Reach', pages: [{ id: 'clients', title: 'Native clients', built: true }] },
                    { title: 'Operate', pages: [{ id: 'health', title: 'Health and performance' }, { id: 'history', title: 'History' }, { id: 'backup', title: 'Backup' }] }
                ];
                var current = 'clients';

                function el(tag, text, className) {
                    var node = document.createElement(tag);
                    if (text != null) node.textContent = text;
                    if (className) node.className = className;
                    return node;
                }

                function table(headings, rows) {
                    var t = el('table');
                    var head = t.appendChild(el('thead')).appendChild(el('tr'));
                    headings.forEach(function (h) { head.appendChild(el('th', h)); });
                    var body = t.appendChild(el('tbody'));
                    rows.forEach(function (cells) {
                        var tr = body.appendChild(el('tr'));
                        cells.forEach(function (cell) {
                            var td = tr.appendChild(el('td'));
                            if (cell && cell.nodeType) td.appendChild(cell);
                            else if (typeof cell === 'number') { td.textContent = String(cell); td.className = 'em-num'; }
                            else td.textContent = cell == null ? '' : cell;
                        });
                    });
                    return t;
                }

                function when(utc) {
                    var date = new Date(utc);
                    return date.getFullYear() < 2000 ? 'Never' : date.toLocaleString();
                }

                function drawNav() {
                    var nav = page.querySelector('.em-nav');
                    nav.textContent = '';
                    groups.forEach(function (group) {
                        var g = nav.appendChild(el('div', null, 'em-nav-group'));
                        g.appendChild(el('h3', group.title));
                        group.pages.forEach(function (p) {
                            var button = g.appendChild(el('button', p.title, 'em-nav-page'));
                            button.type = 'button';
                            button.setAttribute('data-page', p.id);
                            if (p.id === current) button.setAttribute('aria-current', 'page');
                            if (!p.built) button.appendChild(el('span', ' (coming later)', 'em-later'));
                            button.addEventListener('click', function () { current = p.id; drawNav(); drawPanel(); });
                        });
                    });
                }

                function drawPanel() {
                    var panel = page.querySelector('.em-panel');
                    panel.textContent = '';
                    var found = null;
                    groups.forEach(function (g) { g.pages.forEach(function (p) { if (p.id === current) found = p; }); });
                    panel.appendChild(el('h2', found.title));
                    if (!found.built) {
                        panel.appendChild(el('p', 'Coming later.', 'em-muted'));
                        return;
                    }
                    if (current === 'programming') {
                        drawProgramming(panel);
                        return;
                    }
                    panel.appendChild(el('p', 'Which apps your users watch on, and what Experience Manager reaches on each. Every device registered with this server is counted.'));
                    var status = panel.appendChild(el('p', 'Loading…', 'em-muted em-status'));
                    ApiClient.getJSON(ApiClient.getUrl('ExperienceManager/Admin/Clients')).then(function (census) {
                        if (current !== 'clients') return;
                        status.remove();
                        drawCensus(panel, census);
                    }, function () {
                        status.textContent = 'The census could not be loaded. Reload the page to try again.';
                    });
                }

                // The Programming page is its own script, loaded the first time it opens.
                function drawProgramming(panel) {
                    if (window.ExperienceManagerProgramming) {
                        window.ExperienceManagerProgramming.draw(panel);
                        return;
                    }
                    var status = panel.appendChild(el('p', 'Loading…', 'em-muted'));
                    var script = document.createElement('script');
                    script.src = ApiClient.getUrl('ExperienceManager/admin-programming.js');
                    script.onload = function () {
                        status.remove();
                        if (current === 'programming') window.ExperienceManagerProgramming.draw(panel);
                    };
                    script.onerror = function () { status.textContent = 'The Programming page could not be loaded. Reload the page to try again.'; };
                    document.head.appendChild(script);
                }

                function drawCensus(panel, census) {
                    var families = {};
                    census.Reach.forEach(function (r) { families[r.Id] = r.Name; });
                    panel.appendChild(el('h3', 'Reach by app'));
                    panel.appendChild(table(['App', 'Devices', 'Users', 'Today', 'Planned'], census.Reach.map(function (r) {
                        var name = el('div');
                        name.appendChild(el('div', r.Name));
                        if (r.AppNames.length) name.appendChild(el('div', r.AppNames.join(', '), 'em-apps'));
                        return [name, r.Devices, r.Users, r.Today, r.Planned || 'Nothing planned yet.'];
                    })));

                    panel.appendChild(el('h3', 'Reach adapters'));
                    panel.appendChild(el('p', 'Each way Experience Manager reaches an app, and what it found. One not built yet cannot be switched on.', 'em-muted'));
                    panel.appendChild(table(['Adapter', 'How', 'Apps', 'Status'], census.Adapters.map(function (a) {
                        var name = el('div');
                        name.appendChild(el('div', a.Name));
                        name.appendChild(el('div', a.Reaches, 'em-apps'));
                        var status = el('div');
                        status.appendChild(el('div', a.Status + (a.Version ? ' (' + a.Version + ')' : ''), 'em-adapter-status'));
                        status.appendChild(el('div', a.Reason, 'em-apps'));
                        return [name, a.Mechanism, a.Families.map(function (f) { return families[f] || f; }).join(', '), status];
                    })));

                    panel.appendChild(el('h3', 'Clients by user'));
                    if (!census.Users.length) panel.appendChild(el('p', 'No client has signed in yet.', 'em-muted'));
                    census.Users.forEach(function (u) {
                        panel.appendChild(el('h4', u.UserName || 'No user signed in'));
                        panel.appendChild(table(['App', 'Version', 'Device', 'Last active'], u.Devices.map(function (d) {
                            var app = el('div');
                            app.appendChild(el('div', families[d.FamilyId] || d.AppName));
                            if (d.FamilyId === 'other' || families[d.FamilyId] !== d.AppName) app.appendChild(el('div', d.AppName, 'em-apps'));
                            return [app, d.AppVersion, d.DeviceName, when(d.LastActivity)];
                        })));
                    });

                    panel.appendChild(el('h3', 'Server apps'));
                    panel.appendChild(el('p', 'Apps such as Seerr sign in as devices but are not clients anyone watches on.', 'em-muted'));
                    panel.appendChild(census.Services.length
                        ? table(['App', 'Version', 'Device', 'Last active'], census.Services.map(function (d) { return [d.AppName, d.AppVersion, d.DeviceName, when(d.LastActivity)]; }))
                        : el('p', 'None.', 'em-muted'));
                    panel.appendChild(el('p', census.TotalDevices + ' registered devices in all.', 'em-muted em-total'));
                }

                page.addEventListener('pageshow', function () {
                    drawNav();
                    drawPanel();
                });
            })();
        </script>
    </div>
</body>
</html>
