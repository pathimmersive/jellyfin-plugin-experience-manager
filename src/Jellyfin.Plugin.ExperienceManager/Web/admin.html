<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Experience Manager</title>
</head>
<body>
    <div id="experienceManagerPage" data-role="page" class="page type-interior pluginConfigurationPage">
        <style>
            #experienceManagerPage .em-nav { display: flex; flex-wrap: wrap; gap: 1.5em; margin: 1em 0 2em; }
            #experienceManagerPage .em-nav-group { min-width: 9em; }
            #experienceManagerPage .em-nav-group h3 { margin: 0 0 .4em; font-size: .85em; text-transform: uppercase; letter-spacing: .06em; opacity: .7; }
            #experienceManagerPage .em-nav-page { display: block; background: none; border: 0; padding: .25em 0; color: inherit; font: inherit; cursor: pointer; opacity: .75; text-align: left; }
            #experienceManagerPage .em-nav-page[aria-current="page"] { opacity: 1; font-weight: 600; }
            #experienceManagerPage .em-nav-page .em-later { font-size: .8em; opacity: .7; }
            #experienceManagerPage table { border-collapse: collapse; width: 100%; margin: .5em 0 2em; }
            #experienceManagerPage th, #experienceManagerPage td { text-align: left; vertical-align: top; padding: .45em .8em .45em 0; border-bottom: 1px solid rgba(128, 128, 128, .25); }
            #experienceManagerPage th { font-weight: 600; }
            #experienceManagerPage td.em-num { text-align: right; padding-right: 1.5em; }
            #experienceManagerPage .em-apps { font-size: .85em; opacity: .7; }
            #experienceManagerPage .em-muted { opacity: .7; }
            #experienceManagerPage .em-prog { max-width: 100%; }
            #experienceManagerPage .em-prog-toolbar { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; margin: 1em 0; }
            #experienceManagerPage .em-prog-button { margin: 0; }
            #experienceManagerPage .em-prog-view[aria-pressed="true"] { font-weight: 600; outline: 2px solid currentColor; }
            #experienceManagerPage .em-prog-label, #experienceManagerPage .em-ctx-month-label { min-width: 8em; text-align: center; font-weight: 600; }
            #experienceManagerPage .em-prog-message, #experienceManagerPage .em-prog-error { color: #ff8a65; }
            #experienceManagerPage .em-prog-templates { margin: 0 0 1.5em; display: flex; flex-wrap: wrap; gap: .5em; align-items: center; }
            #experienceManagerPage .em-prog-templates h3 { width: 100%; margin: 0; font-size: 1em; }
            #experienceManagerPage .em-prog-year { position: relative; margin: 0 0 2em; }
            #experienceManagerPage .em-prog-lane { display: flex; align-items: stretch; min-height: 2.2em; border-bottom: 1px solid rgba(128, 128, 128, .25); }
            #experienceManagerPage .em-prog-lane-title { flex: 0 0 10em; padding: .45em .5em .45em 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            #experienceManagerPage .em-prog-track { position: relative; flex: 1 1 auto; min-width: 0; }
            #experienceManagerPage .em-prog-months { min-height: 1.6em; font-size: .85em; opacity: .7; }
            #experienceManagerPage .em-prog-month { position: absolute; top: .2em; border-left: 1px solid rgba(128, 128, 128, .35); padding-left: .25em; }
            #experienceManagerPage .em-prog-bar { position: absolute; top: .35em; height: 1.5em; line-height: 1.5em; padding: 0 .35em; box-sizing: border-box; border-radius: .25em; font-size: .8em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
            #experienceManagerPage .em-published { background: rgba(0, 164, 220, .55); }
            #experienceManagerPage .em-draft { border: 1px dashed currentColor; background: rgba(128, 128, 128, .15); }
            #experienceManagerPage .em-prog-bar.em-weekly { background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, .25) 0 2px, transparent 2px 10px); }
            #experienceManagerPage .em-prog-empty { position: absolute; top: .5em; font-size: .8em; }
            #experienceManagerPage .em-prog-today-marker { position: absolute; top: 0; bottom: 0; width: 2px; background: #ff8a65; pointer-events: none; }
            #experienceManagerPage table.em-prog-monthgrid { table-layout: fixed; }
            #experienceManagerPage .em-prog-monthgrid td { height: 5em; overflow: hidden; }
            #experienceManagerPage .em-prog-monthgrid.em-compact td { height: 2.6em; padding: .2em; }
            #experienceManagerPage .em-prog-is-today .em-prog-daynum { color: #ff8a65; font-weight: 600; }
            #experienceManagerPage .em-prog-chip { display: block; font-size: .75em; padding: 0 .3em; margin: .1em 0; border-radius: .2em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; }
            #experienceManagerPage .em-compact .em-prog-chip { display: inline-block; width: .55em; height: .55em; padding: 0; margin: 0 .1em; border-radius: 50%; }
            #experienceManagerPage .em-prog-list { list-style: none; padding: 0; margin: .5em 0 1em; }
            #experienceManagerPage .em-prog-row { display: flex; flex-wrap: wrap; align-items: center; gap: .6em; padding: .5em; margin: 0 0 .4em; border-radius: .3em; }
            #experienceManagerPage .em-prog-handle { cursor: grab; opacity: .6; }
            #experienceManagerPage .em-prog-row-text { flex: 1 1 12em; min-width: 0; }
            #experienceManagerPage .em-prog-row-name { font-weight: 600; }
            #experienceManagerPage .em-prog-row-when { font-size: .85em; }
            #experienceManagerPage .em-prog-switch { display: inline-flex; gap: .3em; align-items: center; }
            #experienceManagerPage .em-prog-conflict { font-style: italic; }
            #experienceManagerPage .em-prog-editor { margin: 2em 0; padding: 1em; border: 1px solid rgba(128, 128, 128, .35); border-radius: .4em; max-width: 46em; box-sizing: border-box; }
            #experienceManagerPage .em-prog-editor fieldset { border: 1px solid rgba(128, 128, 128, .25); margin: 1em 0; padding: .6em; min-width: 0; }
            #experienceManagerPage .em-prog-field { display: flex; flex-wrap: wrap; gap: .5em; align-items: center; margin: .4em 0; }
            #experienceManagerPage .em-prog-field > span { flex: 0 0 8em; }
            #experienceManagerPage .em-prog-field input, #experienceManagerPage .em-prog-field select { max-width: 100%; min-width: 0; box-sizing: border-box; }
            #experienceManagerPage .em-prog-field select[multiple] { min-height: 6em; min-width: 12em; }
            #experienceManagerPage .em-prog-monthday { display: inline-flex; gap: .4em; align-items: center; margin: .4em 1em .4em 0; }
            #experienceManagerPage .em-prog-monthday input { width: 4em; }
            #experienceManagerPage .em-prog-days { display: flex; flex-wrap: wrap; gap: .6em; }
            #experienceManagerPage .em-prog-change { border-top: 1px solid rgba(128, 128, 128, .25); padding: .5em 0; }
            #experienceManagerPage .em-prog-actions { display: flex; flex-wrap: wrap; gap: .5em; }
            #experienceManagerPage .em-prog-mark, #experienceManagerPage .em-prog-hidden { opacity: .8; font-style: italic; }
            #experienceManagerPage .em-aud-list { list-style: none; padding: 0; margin: .5em 0 1em; }
            #experienceManagerPage .em-aud-row { display: flex; flex-wrap: wrap; align-items: center; gap: .6em; padding: .5em; margin: 0 0 .4em; border: 1px solid rgba(128, 128, 128, .3); border-radius: .3em; }
            #experienceManagerPage .em-aud-text { flex: 1 1 14em; min-width: 0; }
            #experienceManagerPage .em-aud-name { font-weight: 600; }
            #experienceManagerPage .em-aud-members, #experienceManagerPage .em-aud-kind { font-size: .85em; opacity: .75; }
            #experienceManagerPage .em-aud-badge { font-size: .75em; padding: .1em .4em; border-radius: .2em; background: rgba(0, 164, 220, .45); }
            #experienceManagerPage .em-aud-days { width: 5em; }
            #experienceManagerPage .em-aud-form { margin: 1.5em 0; padding: 1em; border: 1px solid rgba(128, 128, 128, .35); border-radius: .4em; max-width: 40em; box-sizing: border-box; }
            #experienceManagerPage .em-aud-users { display: flex; flex-wrap: wrap; gap: .4em 1.2em; margin: .6em 0; }
            #experienceManagerPage .em-aud-error { color: #ff8a65; }
            #experienceManagerPage .em-lay-toolbar { display: flex; flex-wrap: wrap; gap: .6em; align-items: center; margin: 1em 0; }
            #experienceManagerPage .em-lay-banner { display: flex; flex-wrap: wrap; gap: .6em; align-items: center; padding: .6em .8em; margin: 0 0 1em; border-radius: .3em; background: rgba(255, 138, 101, .18); }
            #experienceManagerPage .em-lay-list { list-style: none; padding: 0; margin: .5em 0 1em; }
            #experienceManagerPage .em-lay-row { display: flex; flex-wrap: wrap; align-items: center; gap: .6em; padding: .5em; margin: 0 0 .4em; border: 1px solid rgba(128, 128, 128, .3); border-radius: .3em; }
            #experienceManagerPage .em-lay-row:focus { outline: 2px solid #00a4dc; }
            #experienceManagerPage .em-lay-row[aria-selected="true"] { border-color: #00a4dc; }
            #experienceManagerPage .em-lay-row.em-picked { background: rgba(0, 164, 220, .25); }
            #experienceManagerPage .em-lay-row.em-off .em-lay-title { opacity: .55; }
            #experienceManagerPage .em-lay-row.em-removed .em-lay-title { text-decoration: line-through; opacity: .55; }
            #experienceManagerPage .em-lay-text { flex: 1 1 14em; min-width: 0; }
            #experienceManagerPage .em-lay-title { font-weight: 600; }
            #experienceManagerPage .em-lay-type { font-size: .85em; opacity: .75; }
            #experienceManagerPage .em-lay-badge { display: inline-block; font-size: .75em; padding: .1em .4em; margin: .2em .3em 0 0; border-radius: .2em; background: rgba(0, 164, 220, .45); }
            #experienceManagerPage .em-lay-badge.em-missing { background: rgba(255, 138, 101, .55); }
            #experienceManagerPage .em-lay-mark { font-size: .8em; font-style: italic; opacity: .85; }
            #experienceManagerPage .em-lay-panel, #experienceManagerPage .em-lay-add { margin: 1.5em 0; padding: 1em; border: 1px solid rgba(128, 128, 128, .35); border-radius: .4em; max-width: 46em; box-sizing: border-box; }
            #experienceManagerPage .em-lay-types { list-style: none; padding: 0; }
            #experienceManagerPage .em-lay-types li { margin: .4em 0; }
            #experienceManagerPage .em-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
            #experienceManagerPage .em-rule { margin: 0 0 1em; padding: .8em 1em; border: 1px solid rgba(128, 128, 128, .3); border-radius: .4em; max-width: 46em; box-sizing: border-box; }
            #experienceManagerPage .em-rule h3 { margin: 0 0 .3em; font-size: 1em; }
            #experienceManagerPage .em-rule-optouts { font-size: .85em; opacity: .75; }
            #experienceManagerPage .em-rule input[type="number"] { width: 5em; }
            #experienceManagerPage .em-lay-rules { display: flex; flex-wrap: wrap; gap: .3em 1.2em; }
            #experienceManagerPage .em-ctx { margin: 0 0 1em; padding: .6em .8em; border: 1px solid rgba(128, 128, 128, .35); border-radius: .4em; }
            #experienceManagerPage .em-ctx-chip { font-weight: 600; margin: 0 0 .4em; }
            #experienceManagerPage .em-ctx-sheet { display: flex; flex-wrap: wrap; gap: .6em 1.2em; align-items: flex-start; }
            #experienceManagerPage .em-ctx-control { display: inline-flex; gap: .4em; align-items: center; }
            #experienceManagerPage .em-ctx-month-head { display: flex; gap: .4em; align-items: center; }
            #experienceManagerPage .em-ctx-days { display: grid; grid-template-columns: repeat(7, 2.2em); gap: .15em; margin-top: .3em; }
            #experienceManagerPage .em-ctx-day { padding: .2em 0; text-align: center; background: none; border: 1px solid transparent; color: inherit; border-radius: .3em; cursor: pointer; }
            #experienceManagerPage .em-ctx-day[aria-pressed="true"] { border-color: #00a4dc; font-weight: 600; }
            #experienceManagerPage .em-ctx-has-event { box-shadow: inset 0 -3px 0 #00a4dc; }
            #experienceManagerPage .em-preview-wrap { display: flex; flex-wrap: wrap; gap: 1.2em; align-items: flex-start; margin: 2em 0; }
            #experienceManagerPage .em-frame { box-sizing: border-box; border: 6px solid #2a2a2a; border-radius: 10px; background: #101010; color: #eee; padding: .6em; overflow: hidden; max-width: 100%; }
            #experienceManagerPage .em-frame-tv { width: 960px; aspect-ratio: 16 / 9; overflow-y: auto; }
            #experienceManagerPage .em-frame-web { width: 100%; max-width: 1200px; }
            #experienceManagerPage .em-frame-phone { width: 390px; border-radius: 26px; }
            #experienceManagerPage .em-pv-banner { position: relative; height: 13em; border-radius: .4em; background: #222 center / cover no-repeat; display: flex; align-items: flex-end; padding: .6em; box-sizing: border-box; margin: 0 0 .8em; }
            #experienceManagerPage .em-frame-phone .em-pv-banner { height: 9em; }
            #experienceManagerPage .em-pv-banner span { background: rgba(0, 0, 0, .55); padding: .2em .5em; border-radius: .2em; font-weight: 600; }
            #experienceManagerPage .em-pv-row h4 { margin: .5em 0 .3em; font-size: .9em; }
            #experienceManagerPage .em-pv-cards { display: flex; gap: .4em; overflow: hidden; }
            #experienceManagerPage .em-pv-card { flex: 0 0 5.5em; aspect-ratio: 2 / 3; border-radius: .25em; background: #333 center / cover no-repeat; font-size: .65em; display: flex; align-items: flex-end; padding: .2em; box-sizing: border-box; overflow: hidden; }
            #experienceManagerPage .em-frame-phone .em-pv-card { flex-basis: 4.2em; }
            #experienceManagerPage .em-why { flex: 1 1 18em; min-width: 0; padding: .8em 1em; border: 1px solid rgba(128, 128, 128, .35); border-radius: .4em; }
            #experienceManagerPage .em-why h3 { margin: 0 0 .4em; font-size: 1em; }
            #experienceManagerPage .em-why li { margin: .2em 0; }
            #experienceManagerPage .em-lay-readonly { padding: .6em .8em; border-radius: .3em; background: rgba(0, 164, 220, .15); margin: 0 0 1em; }
            @media (max-width: 600px) {
                #experienceManagerPage .em-ctx-sheet { display: none; }
                #experienceManagerPage .em-context[data-open="true"] .em-ctx-sheet { display: flex; }
                #experienceManagerPage .em-frame-tv { width: 100%; }
            }
            @media (max-width: 600px) {
                #experienceManagerPage .em-nav { gap: .8em; }
                #experienceManagerPage .em-prog-field > span { flex-basis: 100%; }
                #experienceManagerPage .em-prog-editor { padding: .6em; }
            }
        </style>
        <div data-role="content">
            <div class="content-primary">
                <h2 class="sectionTitle">Experience Manager</h2>
                <nav class="em-nav" aria-label="Experience Manager"></nav>
                <div class="em-panel"></div>
            </div>
        </div>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#experienceManagerPage');
                // The admin pages, grouped as the plugin's design has them. Only the built ones open.
                var groups = [
                    { title: 'Experience', pages: [{ id: 'layout', title: 'Home layout', built: true }, { id: 'programming', title: 'Programming', built: true }] },
                    { title: 'People', pages: [{ id: 'audiences', title: 'Audiences', built: true }, { id: 'defaults', title: 'Group defaults' }] },
                    { title: 'Rules', pages: [{ id: 'rules', title: 'Content rules', built: true }, { id: 'integrations', title: 'Integrations' }] },
                    { title: 'Reach', pages: [{ id: 'clients', title: 'Native clients', built: true }] },
                    { title: 'Operate', pages: [{ id: 'health', title: 'Health and performance' }, { id: 'history', title: 'History', built: true }, { id: 'backup', title: 'Backup' }] }
                ];
                var current = 'clients';

                function el(tag, text, className) {
                    var node = document.createElement(tag);
                    if (text != null) node.textContent = text;
                    if (className) node.className = className;
                    return node;
                }

                function table(headings, rows) {
                    var t = el('table');
                    var head = t.appendChild(el('thead')).appendChild(el('tr'));
                    headings.forEach(function (h) { head.appendChild(el('th', h)); });
                    var body = t.appendChild(el('tbody'));
                    rows.forEach(function (cells) {
                        var tr = body.appendChild(el('tr'));
                        cells.forEach(function (cell) {
                            var td = tr.appendChild(el('td'));
                            if (cell && cell.nodeType) td.appendChild(cell);
                            else if (typeof cell === 'number') { td.textContent = String(cell); td.className = 'em-num'; }
                            else td.textContent = cell == null ? '' : cell;
                        });
                    });
                    return t;
                }

                function when(utc) {
                    var date = new Date(utc);
                    return date.getFullYear() < 2000 ? 'Never' : date.toLocaleString();
                }

                function drawNav() {
                    var nav = page.querySelector('.em-nav');
                    nav.textContent = '';
                    groups.forEach(function (group) {
                        var g = nav.appendChild(el('div', null, 'em-nav-group'));
                        g.appendChild(el('h3', group.title));
                        group.pages.forEach(function (p) {
                            var button = g.appendChild(el('button', p.title, 'em-nav-page'));
                            button.type = 'button';
                            button.setAttribute('data-page', p.id);
                            if (p.id === current) button.setAttribute('aria-current', 'page');
                            if (!p.built) button.appendChild(el('span', ' (coming later)', 'em-later'));
                            button.addEventListener('click', function () { current = p.id; drawNav(); drawPanel(); });
                        });
                    });
                }

                function drawPanel() {
                    var panel = page.querySelector('.em-panel');
                    panel.textContent = '';
                    var found = null;
                    groups.forEach(function (g) { g.pages.forEach(function (p) { if (p.id === current) found = p; }); });
                    panel.appendChild(el('h2', found.title));
                    if (!found.built) {
                        panel.appendChild(el('p', 'Coming later.', 'em-muted'));
                        return;
                    }
                    if (current === 'layout' || current === 'programming') {
                        var bar = panel.appendChild(el('div', null, 'em-context'));
                        loadScripts(['admin-programming.js', 'admin-context.js'], function () {
                            if (bar.isConnected) window.ExperienceManagerContext.drawBar(bar);
                        });
                    }
                    if (drafted.indexOf(current) >= 0) drawBanner(panel.appendChild(el('div', null, 'em-publish')));
                    if (current === 'history') {
                        drawHistory(panel);
                        return;
                    }
                    if (current === 'programming') {
                        drawScript(panel, 'admin-programming.js', 'ExperienceManagerProgramming', ['admin-context.js']);
                        return;
                    }
                    if (current === 'layout') {
                        drawScript(panel, 'admin-layout.js', 'ExperienceManagerLayout', ['admin-programming.js', 'admin-context.js']);
                        return;
                    }
                    if (current === 'rules') {
                        drawScript(panel, 'admin-rules.js', 'ExperienceManagerRules');
                        return;
                    }
                    if (current === 'audiences') {
                        drawScript(panel, 'admin-audiences.js', 'ExperienceManagerAudiences');
                        return;
                    }
                    panel.appendChild(el('p', 'Which apps your users watch on, and what Experience Manager reaches on each. Every device registered with this server is counted.'));
                    var status = panel.appendChild(el('p', 'Loading…', 'em-muted em-status'));
                    ApiClient.getJSON(ApiClient.getUrl('ExperienceManager/Admin/Clients')).then(function (census) {
                        if (current !== 'clients') return;
                        status.remove();
                        drawCensus(panel, census);
                    }, function () {
                        status.textContent = 'The census could not be loaded. Reload the page to try again.';
                    });
                }

                // The pages that edit what is drafted: their edits wait in the draft until Publish.
                var drafted = ['layout', 'programming', 'rules'];

                function adminCall(method, path) {
                    return fetch(ApiClient.getUrl('ExperienceManager/Admin/' + path), { method: method, headers: { Authorization: 'MediaBrowser Token="' + ApiClient.accessToken() + '"' } })
                        .then(function (r) { return r.text().then(function (t) { var b = null; try { b = t ? JSON.parse(t) : null; } catch (e) { b = null; } return { ok: r.ok, body: b }; }); });
                }

                // One banner names the draft's changes, with Undo, Discard and Publish; the editors redraw when it changes.
                function drawBanner(box, confirmation) {
                    adminCall('GET', 'Publish').then(function (r) {
                        if (!r.ok || !box.isConnected) return;
                        var draft = r.body;
                        box.textContent = '';
                        if (confirmation) {
                            var done = box.appendChild(el('p', confirmation + ' ', 'em-publish-done'));
                            var link = done.appendChild(el('button', 'See History', 'raised button-alt em-prog-button em-publish-history'));
                            link.type = 'button';
                            link.addEventListener('click', function () { current = 'history'; drawNav(); drawPanel(); });
                        }
                        if (!draft.HasDraft) return;
                        var bar = box.appendChild(el('div', null, 'em-lay-banner em-publish-banner'));
                        var count = draft.Changes.length;
                        bar.appendChild(el('span', 'Unpublished: ' + draft.Changes.join(', ') + ' · ', 'em-publish-changes'));
                        function act(text, className, onClick) {
                            var b = bar.appendChild(el('button', text, 'raised button-alt em-prog-button ' + className));
                            b.type = 'button';
                            b.addEventListener('click', onClick);
                            return b;
                        }
                        if (draft.CanUndo) act('Undo', 'em-publish-undo', function () { adminCall('POST', 'Publish/Undo').then(function () { drawPanel(); }); });
                        act('Discard', 'em-publish-discard', function () { adminCall('POST', 'Publish/Discard').then(function () { drawPanel(); }); });
                        act('Publish…', 'em-publish-open', function () {
                            var summary = box.querySelector('.em-publish-summary') || box.appendChild(el('div', null, 'em-rule em-publish-summary'));
                            summary.textContent = '';
                            summary.appendChild(el('h3', 'Publish ' + count + (count === 1 ? ' change' : ' changes')));
                            var list = summary.appendChild(el('ul'));
                            draft.Changes.forEach(function (c) { list.appendChild(el('li', c)); });
                            summary.appendChild(el('p', 'Everyone sees these on Home once you publish.', 'em-muted'));
                            var go = summary.appendChild(el('button', 'Publish', 'raised button-submit em-prog-button em-publish-go'));
                            go.type = 'button';
                            go.addEventListener('click', function () {
                                adminCall('POST', 'Publish').then(function (p) {
                                    if (!p.ok) return;
                                    drawBanner(box, 'Published version ' + p.body.Id + '.');
                                });
                            });
                        });
                    });
                }

                document.addEventListener('em-draft-changed', function () {
                    var box = page.querySelector('.em-publish');
                    if (box) drawBanner(box);
                });

                function drawHistory(panel) {
                    panel.appendChild(el('p', 'Every published version, newest first. Restore makes a version the draft; publish it to bring it back. Events starting and ending are listed too.'));
                    var box = panel.appendChild(el('div', null, 'em-history'));
                    var status = box.appendChild(el('p', 'Loading…', 'em-muted'));
                    adminCall('GET', 'History').then(function (r) {
                        if (!r.ok) { status.textContent = 'History could not be loaded. Reload the page to try again.'; return; }
                        status.remove();
                        var rows = r.body.Versions.map(function (v) { return { at: v.At, version: v }; })
                            .concat(r.body.Entries.map(function (e) { return { at: e.At, entry: e }; }))
                            .sort(function (a, b) { return new Date(b.at) - new Date(a.at); });
                        var list = box.appendChild(el('ol', null, 'em-aud-list'));
                        rows.forEach(function (row) {
                            var item = list.appendChild(el('li', null, 'em-aud-row'));
                            var text = item.appendChild(el('div', null, 'em-aud-text'));
                            if (row.entry) {
                                item.setAttribute('data-entry', '');
                                text.appendChild(el('div', row.entry.Text, 'em-muted'));
                                text.appendChild(el('div', when(row.at), 'em-aud-kind'));
                                return;
                            }
                            var v = row.version;
                            item.setAttribute('data-version', v.Id);
                            text.appendChild(el('div', 'Version ' + v.Id + (v.Id === r.body.Version ? ' · live' : ''), 'em-aud-name'));
                            text.appendChild(el('div', v.Author + ' · ' + when(v.At), 'em-aud-kind'));
                            text.appendChild(el('div', v.Summary, 'em-aud-members'));
                            if (v.Id !== r.body.Version) {
                                var restore = item.appendChild(el('button', 'Restore', 'raised button-alt em-prog-button em-history-restore'));
                                restore.type = 'button';
                                restore.addEventListener('click', function () {
                                    adminCall('POST', 'History/' + v.Id + '/Restore').then(function (x) {
                                        var note = panel.querySelector('.em-history-note') || panel.insertBefore(el('p', null, 'em-history-note'), box);
                                        note.textContent = x.ok ? 'Version ' + v.Id + ' is now the draft. Publish it on Home layout, Programming or Content rules to bring it back.' : 'That version could not be restored.';
                                    });
                                });
                            }
                        });
                    });
                }

                // The pages and the context bar are scripts of their own, each loaded once, in order.
                var loaded = {};
                function loadScripts(files, done, failed) {
                    if (!files.length) { done(); return; }
                    var file = files[0];
                    var rest = function () { loadScripts(files.slice(1), done, failed); };
                    if (loaded[file] === true) { rest(); return; }
                    if (loaded[file]) { loaded[file].push(rest); return; }
                    loaded[file] = [rest];
                    var script = document.createElement('script');
                    script.src = ApiClient.getUrl('ExperienceManager/' + file);
                    script.onload = function () { var waiting = loaded[file]; loaded[file] = true; waiting.forEach(function (w) { w(); }); };
                    script.onerror = function () { delete loaded[file]; if (failed) failed(); };
                    document.head.appendChild(script);
                }

                function drawScript(panel, file, name, needs) {
                    var opened = current;
                    var status = panel.appendChild(el('p', 'Loading…', 'em-muted'));
                    loadScripts((needs || []).concat([file]), function () {
                        status.remove();
                        if (current === opened) window[name].draw(panel);
                    }, function () { status.textContent = 'This page could not be loaded. Reload the page to try again.'; });
                }

                function drawCensus(panel, census) {
                    var families = {};
                    census.Reach.forEach(function (r) { families[r.Id] = r.Name; });
                    panel.appendChild(el('h3', 'Reach by app'));
                    panel.appendChild(table(['App', 'Devices', 'Users', 'Today', 'Planned'], census.Reach.map(function (r) {
                        var name = el('div');
                        name.appendChild(el('div', r.Name));
                        if (r.AppNames.length) name.appendChild(el('div', r.AppNames.join(', '), 'em-apps'));
                        return [name, r.Devices, r.Users, r.Today, r.Planned || 'Nothing planned yet.'];
                    })));

                    panel.appendChild(el('h3', 'Reach adapters'));
                    panel.appendChild(el('p', 'Each way Experience Manager reaches an app, and what it found. One not built yet cannot be switched on.', 'em-muted'));
                    panel.appendChild(table(['Adapter', 'How', 'Apps', 'Status'], census.Adapters.map(function (a) {
                        var name = el('div');
                        name.appendChild(el('div', a.Name));
                        name.appendChild(el('div', a.Reaches, 'em-apps'));
                        var status = el('div');
                        status.appendChild(el('div', a.Status + (a.Version ? ' (' + a.Version + ')' : ''), 'em-adapter-status'));
                        status.appendChild(el('div', a.Reason, 'em-apps'));
                        return [name, a.Mechanism, a.Families.map(function (f) { return families[f] || f; }).join(', '), status];
                    })));

                    panel.appendChild(el('h3', 'Clients by user'));
                    if (!census.Users.length) panel.appendChild(el('p', 'No client has signed in yet.', 'em-muted'));
                    census.Users.forEach(function (u) {
                        panel.appendChild(el('h4', u.UserName || 'No user signed in'));
                        panel.appendChild(table(['App', 'Version', 'Device', 'Last active'], u.Devices.map(function (d) {
                            var app = el('div');
                            app.appendChild(el('div', families[d.FamilyId] || d.AppName));
                            if (d.FamilyId === 'other' || families[d.FamilyId] !== d.AppName) app.appendChild(el('div', d.AppName, 'em-apps'));
                            return [app, d.AppVersion, d.DeviceName, when(d.LastActivity)];
                        })));
                    });

                    panel.appendChild(el('h3', 'Server apps'));
                    panel.appendChild(el('p', 'Apps such as Seerr sign in as devices but are not clients anyone watches on.', 'em-muted'));
                    panel.appendChild(census.Services.length
                        ? table(['App', 'Version', 'Device', 'Last active'], census.Services.map(function (d) { return [d.AppName, d.AppVersion, d.DeviceName, when(d.LastActivity)]; }))
                        : el('p', 'None.', 'em-muted'));
                    panel.appendChild(el('p', census.TotalDevices + ' registered devices in all.', 'em-muted em-total'));
                }

                page.addEventListener('pageshow', function () {
                    drawNav();
                    drawPanel();
                });
            })();
        </script>
    </div>
</body>
</html>
